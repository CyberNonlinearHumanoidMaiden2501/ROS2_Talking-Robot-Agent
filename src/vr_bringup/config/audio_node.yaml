# ROS2 parameters for audio_node (mic capture + speaker playback).
# Devices route through the PipeWire default source/sink, so WirePlumber
# picks the PDP mic / system speaker without "device busy" conflicts.
audio_node:
  ros__parameters:
    sample_rate: 16000
    channels: 1
    block_ms: 32           # must stay 32: silero VAD consumes 512-sample blocks @16 kHz
    input_device: "default"
    output_device: "default"
    mock_audio: false      # true = do not open mic/speaker (dev dry-run)
    echo_mode: "duck"      # duck: mute capture while speaking | aec: live capture (M2 barge-in)
