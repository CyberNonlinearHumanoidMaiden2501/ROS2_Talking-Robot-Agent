# PipeWire echo-cancel drop-in (groundwork for M2 barge-in).
# Install to ~/.config/pipewire/pipewire.conf.d/99-echo-cancel.conf, then
# restart pipewire (user-level, no sudo):
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp config/pipewire/99-echo-cancel.conf ~/.config/pipewire/pipewire.conf.d/
#   systemctl --user restart pipewire pipewire-pulse
# Then set "Echo-Cancel Sink" as the default output and "Echo-Cancel Source"
# as the default input (GNOME Settings > Sound, or wpctl set-default <id>).
# Rollback: delete the file and restart pipewire again.
context.modules = [
  {   name = libpipewire-module-echo-cancel
      args = {
          node.name = "echo-cancel"
          library.name = "aec-webrtc"
          source.props = {
              node.name = "echo-cancel-source"
              node.description = "Echo-Cancel Source"
          }
          sink.props = {
              node.name = "echo-cancel-sink"
              node.description = "Echo-Cancel Sink"
          }
      }
  }
]
