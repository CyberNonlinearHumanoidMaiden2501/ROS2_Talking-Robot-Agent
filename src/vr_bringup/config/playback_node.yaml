# ROS2 parameters for playback_node (Play action -> speaker).
playback_node:
  ros__parameters:
    output_device: "default"
    mock_audio: false      # true = simulate playback without a speaker (dev dry-run)
    tick_ms: 40            # playback state-machine period
    chunk_ratio: 1.2       # audio written per tick / period; must exceed 1 so the
                           # device buffer stays filled (below 1 causes click gaps)
