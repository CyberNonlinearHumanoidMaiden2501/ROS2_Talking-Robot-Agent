# ROS2 parameters for vad_node (Silero VAD + utterance segmentation).
vad_node:
  ros__parameters:
    vad.threshold: 0.5           # Silero speech probability
    vad.min_speech_ms: 250       # ignore shorter bursts (noise)
    vad.end_silence_ms: 600      # silence after which an utterance is finalized
    vad.max_utterance_ms: 30000  # auto-finalize runaway utterances
