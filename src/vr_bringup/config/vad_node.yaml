# ROS2 parameters for vad_node (Silero VAD sliding-window segmentation).
vad_node:
  ros__parameters:
    vad.threshold: 0.5        # Silero speech probability
    vad.window_blocks: 6      # sliding window size in 32 ms blocks (~192 ms)
    vad.prob_blocks: 3        # oldest N probs averaged for the speech decision
