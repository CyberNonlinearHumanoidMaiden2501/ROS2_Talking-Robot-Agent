# Audio hardware + voice-activity settings (M1+).
# Device names come from PipeWire; TODO(M1): confirm the input actually
# carries voice (it currently exposes only an IEC958 digital input node).
sample_rate: 16000
channels: 1
block_ms: 30

input_device: "alsa_input.usb-Generic_USB_Audio-00.iec958-stereo"
output_device: "alsa_output.usb-Generic_USB_Audio-00.analog-stereo"

vad:
  threshold: 0.5          # Silero speech probability
  min_speech_ms: 250      # ignore shorter bursts (noise)
  end_silence_ms: 600     # silence after which an utterance is finalized

# duck: attenuate/mute mic while speaking (no barge-in).
# aec:  PipeWire echo-cancel module (barge-in works). Enabled in M1 if clean.
echo_mode: "duck"
